<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ask Averill</title><link rel="stylesheet" href="../design-system/tokens.css"><style>
@font-face{font-family:'Spline Sans';font-style:normal;font-weight:400;font-display:swap;src:url('../node_modules/@fontsource/spline-sans/files/spline-sans-latin-400-normal.woff2') format('woff2')}
html,body{margin:0;background:transparent;font-family:var(--ds-font-body);color:#f4f5f3}
.shell{width:208px;height:82px;box-sizing:border-box;border:1px solid #91d3df;border-radius:16px;background:#002129;box-shadow:0 6px 22px #00171d99;overflow:hidden}
.grip{height:17px;padding:2px 12px 0;box-sizing:border-box;color:#91b2bf;font-size:10px;letter-spacing:.18em;-webkit-app-region:drag;cursor:move}
.row{display:flex;gap:6px;align-items:center;padding:0 7px 3px}
button{-webkit-app-region:no-drag;cursor:pointer;border:0;border-radius:9px;font-size:12px;font-weight:650;height:40px}
#open{flex:1;background:var(--ds-color-signal);color:#002129}#stop{background:#0c303a;color:var(--ds-color-verified);padding:0 9px}#stop:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:2px solid #f4f5f3;outline-offset:1px}
#status{display:block;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#bdd5df;font-size:11px}
button{transition:transform 140ms cubic-bezier(.22,1,.36,1),background-color 140ms}button:not(:disabled):active{transform:translateY(1px);transition-duration:80ms}#open:hover{background:var(--ds-color-signal-hover)}#stop:not(:disabled):hover{background:var(--ds-color-panel-hover)}@media(prefers-reduced-motion:reduce){button{transition:none}button:active{transform:none!important}}
/* While work is shared, match the main window session bar: live dot and coral Stop; Open steps back. */
.live #status::before{content:"";display:inline-block;width:7px;height:7px;margin-right:6px;border-radius:50%;background:var(--ds-color-signal);vertical-align:1px}
.live #stop{background:var(--ds-color-signal);color:#002129}.live #stop:not(:disabled):hover{background:var(--ds-color-signal-hover)}
.live #open{background:#0c303a;color:var(--ds-color-verified)}.live #open:hover{background:var(--ds-color-panel-hover)}
</style><link rel="stylesheet" href="companion-theme.css"><style>html,body{font-family:var(--av-font);color:var(--av-text)}.shell{background:var(--av-canvas);border-color:var(--av-control-border);box-shadow:0 6px 22px #18151e66}.grip,#status{color:var(--av-text-secondary)}#open{background:var(--av-accent);color:var(--av-on-accent)}#open:hover{background:var(--av-accent-hover)}#stop,.live #open{background:var(--av-surface);color:var(--av-text)}.live #stop{background:var(--av-warning);color:var(--av-on-accent)}.live #status::before{background:var(--av-accent)}button{font-family:var(--av-font)}</style></head><body><div class="shell"><div class="grip" aria-label="Drag Averill button">AVERILL · DRAG TO MOVE</div><div class="row"><button id="open" type="button">Ask Averill</button><button id="stop" type="button" disabled>Stop</button></div><span id="status" role="status">No work shared</span></div><script>
const status=document.getElementById('status'),stop=document.getElementById('stop');
function render(value){const time=value.capturedAt?` · ${new Date(value.capturedAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}`:'';status.textContent=value.error||(value.watching?`${value.window}${time}`:value.window?`Selected: ${value.window}${time}`:'No work shared');status.title=status.textContent;stop.disabled=!value.window;document.body.classList.toggle('live',Boolean(value.window));stop.title=value.window?'Stop sharing the selected window':'No work shared';}
document.getElementById('open').addEventListener('click',()=>window.desktop.openCompanion());
stop.addEventListener('click',async()=>{await window.desktop.stopCompanion();});
window.desktop.onCompanionStatus(render);
window.desktop.companionSnapshot().then(render).catch(()=>{});
</script></body></html>
