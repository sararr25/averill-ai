<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#FFF8E9"/><g transform="translate(60 55) scale(1.5)"><rect width="48" height="48" rx="10" fill="#FFF8E9"/><path d="M8 12 18 35h6l10-23h-7l-6 16-6-16Z" fill="#0E576B"/><path d="M36 7v7M32.5 10.5h7" stroke="#D52C85" stroke-width="3" stroke-linecap="round"/><path d="M7 41c8-2 16-2 25-1" fill="none" stroke="#F16D73" stroke-width="3" stroke-linecap="round"/></g><g fill="#0E576B" font-family="DM Sans,sans-serif"><text x="150" y="108" font-size="52">Vamo</text><text x="60" y="220" font-size="34">Brand and company context</text><text x="60" y="280" font-size="23">Version: 2. Owner: Alex Holm, CEO. Synthetic company guidance.</text><text x="60" y="345" font-size="24">Vamo is a travel collective for curious people and shared experiences.</text><text x="60" y="395" font-size="24">Collections: Copenhagen, Vienna and Prague.</text><text x="60" y="465" font-size="24">Voice: warm, direct, concrete. Go somewhere good.</text><text x="60" y="515" font-size="24">No unsupported price, availability or booking guarantees.</text><text x="60" y="585" font-size="24">Averill is the assistant. Vamo is the independent fictional customer.</text><text x="60" y="655" font-size="22">The demo website has no booking, payment or enquiry backend.</text><text x="60" y="725" font-size="20">Vamo palette: cream, sea ink, mint, coral and fuchsia.</text></g></svg>
